name = "rrd-admin-api"
main = "src/index.js"
compatibility_date = "2026-08-09"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "rrd-media"

[[d1_databases]]
binding = "DB"
database_name = "rrd-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
ALLOWED_ORIGIN = "https://REPLACE_WITH_YOUR_GITHUB_USERNAME.github.io"
PUBLIC_MEDIA_BASE = "https://REPLACE_WITH_WORKER_HOST"
